<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dujeen Quest — ต้นแบบหน้าตาเกม (responsive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;600&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1428; --night2:#1A2340; --night3:#25325A;
  --lantern:#FF9E2C; --lantern-dk:#B5610A;
  --seal:#E23B2E; --seal-dk:#96190F;
  --jade:#35D6A4; --jade-dk:#127A59;
  --paper:#F4EAD6; --dim:#7C88AE;
  --r:18px; --rail:0px; --pad:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Kanit',sans-serif;font-weight:300;
  background:var(--night);color:var(--paper);min-height:100vh;
}
#app{
  position:relative;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(120% 55% at 50% 0%,#1D2748 0%,var(--night) 62%);
}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.spark{
  position:absolute;width:5px;height:5px;border-radius:50%;background:var(--lantern);
  opacity:.5;box-shadow:0 0 12px 3px rgba(255,158,44,.55);animation:drift linear infinite;
}
@keyframes drift{
  0%{transform:translateY(110vh) scale(.6);opacity:0}
  12%{opacity:.6} 88%{opacity:.5}
  100%{transform:translateY(-12vh) scale(1.1);opacity:0}
}

/* ================= layout shell ================= */
main{position:relative;z-index:1;padding-left:var(--rail)}
.screen{display:none;min-height:100vh;padding:22px var(--pad) 108px;animation:enter .34s cubic-bezier(.2,.8,.3,1)}
.screen.on{display:block}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:430px;margin:0 auto}

/* ================= buttons ================= */
.btn{
  display:block;width:100%;border:0;cursor:pointer;
  font-family:'Kanit',sans-serif;font-weight:600;font-size:19px;
  color:#3A1D00;background:var(--lantern);padding:16px;border-radius:var(--r);
  box-shadow:0 6px 0 var(--lantern-dk),0 12px 30px rgba(255,158,44,.34);
  transition:transform .09s,box-shadow .09s,filter .15s;
}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--night3);font-weight:300;font-size:16px}
.btn[disabled]{background:var(--night2);color:var(--dim);box-shadow:0 6px 0 #121A32;cursor:default}
@media(hover:hover){
  .btn:not([disabled]):hover{filter:brightness(1.08)}
  .card:hover{transform:translateY(-3px);box-shadow:0 9px 0 #101838}
  .lamp:hover .glass{filter:brightness(1.18)}
  .opt:hover{border-color:var(--night3)}
  .rail button:hover{color:var(--paper)}
}
.btn:not([disabled]):active{transform:translateY(6px);box-shadow:0 0 0 var(--lantern-dk),0 4px 14px rgba(255,158,44,.28)}
.btn.ghost:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--night3)}

/* ================= start ================= */
#start .hero{display:grid;gap:0;place-items:center;text-align:center;padding-top:9vh}
.bigLantern{width:112px;height:138px;position:relative;margin-bottom:30px;animation:sway 4.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.bigLantern .body{
  position:absolute;inset:14px 0 16px;border-radius:50%/34%;
  background:linear-gradient(180deg,#FFC470,var(--lantern) 45%,#D9741A);
  box-shadow:0 0 60px 18px rgba(255,158,44,.42),inset 0 -10px 22px rgba(0,0,0,.22);
}
.bigLantern .cap,.bigLantern .base{position:absolute;left:50%;transform:translateX(-50%);width:52px;height:13px;border-radius:4px;background:#8E2B1E}
.bigLantern .cap{top:6px} .bigLantern .base{bottom:8px}
.bigLantern .zi{position:absolute;inset:0;display:grid;place-items:center;font-family:'Noto Serif SC',serif;font-size:52px;color:#7A1F13}
.bigLantern .tassel{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);width:3px;height:22px;background:var(--seal);border-radius:2px}
.title{font-family:'Noto Serif SC',serif;font-size:44px;letter-spacing:2px;color:var(--lantern);text-shadow:0 0 26px rgba(255,158,44,.5)}
.subtitle{font-size:22px;font-weight:500;margin-top:2px}
.tag{color:var(--dim);font-size:14px;margin:10px 0 36px;line-height:1.6}
.startBtns{width:100%;max-width:290px}
.startBtns .btn{margin-bottom:12px}

/* ================= top bar ================= */
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.back{width:40px;height:40px;flex:none;border:0;cursor:pointer;border-radius:12px;background:var(--night2);color:var(--paper);font-size:20px;line-height:1}
.stat{display:flex;align-items:center;gap:6px;background:var(--night2);padding:8px 13px;border-radius:99px;font-size:15px;font-weight:500}
.h1{font-size:25px;font-weight:600}
.h2{font-size:13px;color:var(--dim);letter-spacing:1px}

/* ================= chapter cards ================= */
.chapGrid{display:grid;gap:13px}
.card{
  position:relative;display:flex;gap:14px;align-items:center;
  background:var(--night2);border-radius:var(--r);padding:16px;
  cursor:pointer;overflow:hidden;box-shadow:0 5px 0 #101838;
  transition:transform .12s,box-shadow .12s;
}
.card:active{transform:translateY(5px);box-shadow:0 0 0 #101838}
.card.lock{opacity:.45;cursor:default}
.card.lock:active,.card.lock:hover{transform:none;box-shadow:0 5px 0 #101838}
.num{width:54px;height:54px;flex:none;border-radius:15px;display:grid;place-items:center;font-family:'Noto Serif SC',serif;font-size:26px;background:var(--night3);color:var(--lantern)}
.card.done .num{background:var(--jade-dk);color:#CFFBEB}
.card .txt{flex:1;min-width:0}
.card .zh{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--lantern);margin-bottom:1px}
.card .th{font-size:17px;font-weight:500;line-height:1.25}
.bar{height:6px;background:#101838;border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px}
.card .cnt{font-size:12px;color:var(--dim);margin-top:5px}
.seal{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;transform:rotate(-13deg);font-family:'Noto Serif SC',serif;font-size:20px;color:#FFD9D2;background:var(--seal);box-shadow:inset 0 0 0 2px #FF8878}

/* ================= path ================= */
.pathGrid{display:grid;gap:20px}
.rope{position:relative;padding:18px 0 24px;grid-area:rope}
.rope:before{content:'';position:absolute;left:50%;top:0;bottom:30px;width:2px;transform:translateX(-50%);background:repeating-linear-gradient(180deg,var(--night3) 0 9px,transparent 9px 17px)}
.node{position:relative;display:flex;margin-bottom:26px}
.node.l{justify-content:flex-start;padding-left:34px}
.node.r{justify-content:flex-end;padding-right:34px}
.lamp{width:78px;background:none;border:0;cursor:pointer;color:inherit;font-family:inherit;text-align:center;transition:transform .1s}
.lamp:active{transform:scale(.93)}
.lamp .glass{width:66px;height:80px;margin:0 auto 7px;position:relative;border-radius:50%/34%;background:#1E2846;box-shadow:inset 0 -8px 16px rgba(0,0,0,.4);transition:filter .18s}
.lamp .glass:before,.lamp .glass:after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:34px;height:9px;border-radius:3px;background:#4A2A24}
.lamp .glass:before{top:-4px} .lamp .glass:after{bottom:-4px}
.lamp .ico{position:absolute;inset:0;display:grid;place-items:center;font-family:'Noto Serif SC',serif;font-size:27px;color:#46557E}
.lamp .cap{font-size:12px;color:var(--dim);line-height:1.3}
.lamp.done .glass{background:linear-gradient(180deg,#7BF0CB,var(--jade) 50%,#189B72);box-shadow:0 0 30px 7px rgba(53,214,164,.34)}
.lamp.done .ico{color:#0A4234} .lamp.done .cap{color:#9DE9CE}
.lamp.now .glass{background:linear-gradient(180deg,#FFCE86,var(--lantern) 50%,#D0740F);box-shadow:0 0 40px 12px rgba(255,158,44,.5);animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.lamp.now .ico{color:#66330A} .lamp.now .cap{color:var(--lantern);font-weight:500}
.lamp.lock .glass{opacity:.5}
.tiny{position:absolute;top:-6px;right:2px;width:24px;height:24px;border-radius:50%;background:var(--seal);display:grid;place-items:center;font-size:12px;font-family:'Noto Serif SC',serif;color:#FFE3DE;transform:rotate(-12deg)}

.panel{background:var(--night2);border-radius:var(--r);padding:16px}
.panel h5{font-size:13px;color:var(--dim);letter-spacing:1px;font-weight:300;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--night3);border-radius:11px;padding:7px 11px;text-align:center;cursor:pointer;border:0;color:inherit;font-family:inherit}
.chip b{display:block;font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700}
.chip i{font-style:normal;font-size:11px;color:var(--dim)}
.stampRow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sm{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-family:'Noto Serif SC',serif;font-size:17px;background:var(--seal);color:#FFE3DE;transform:rotate(-8deg)}
.sm.off{background:#141C36;color:#2E3A5E;transform:none}
#pVocab{grid-area:a} #pStamp{grid-area:b}

/* ================= quiz ================= */
.quizGrid{display:grid;gap:20px}
.prog{height:12px;background:var(--night2);border-radius:99px;overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;width:35%;border-radius:99px;background:linear-gradient(90deg,var(--lantern),#FFD08A)}
.ask{font-size:15px;color:var(--dim);margin-bottom:14px}
.word{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.spk{width:62px;height:62px;flex:none;border:0;cursor:pointer;border-radius:19px;background:var(--lantern);color:#3A1D00;font-size:26px;box-shadow:0 5px 0 var(--lantern-dk)}
.spk:active{transform:translateY(5px);box-shadow:none}
.py{font-size:14px;color:var(--lantern)}
.hz{font-family:'Noto Serif SC',serif;font-size:40px;line-height:1.1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.opt{background:var(--night2);border:2px solid transparent;border-radius:var(--r);padding:14px 10px;cursor:pointer;text-align:center;color:inherit;font-family:inherit;font-size:15px;box-shadow:0 5px 0 #101838;transition:transform .1s,box-shadow .1s,border-color .12s}
.opt:active{transform:translateY(5px);box-shadow:none}
.opt .emo{font-size:44px;display:block;margin-bottom:6px}
.opt.sel{border-color:var(--lantern);background:#2A2F1E}
.opt.good{border-color:var(--jade);background:#12332A}
.opt.bad{border-color:var(--seal);background:#33161A}

/* ================= overlays ================= */
.dim{position:fixed;inset:0;background:rgba(6,10,22,.72);z-index:20;display:none;align-items:flex-end;justify-content:center}
.dim.on{display:flex}
.sheet{width:100%;max-width:430px;background:var(--night2);border-radius:26px 26px 0 0;padding:24px 20px 30px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-size:20px;font-weight:600;margin-bottom:6px}
.sheet p{font-size:14px;color:var(--dim);line-height:1.6;margin-bottom:18px}
.sheet .btn{margin-bottom:9px}
.fx{position:fixed;left:var(--rail);right:0;bottom:0;z-index:30;padding:16px var(--pad) 20px;transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.fx.on{transform:none}
.fx .in{border-radius:22px;padding:18px;max-width:430px;margin:0 auto}
.fx.ok .in{background:#12332A;box-shadow:inset 0 0 0 2px var(--jade)}
.fx.no .in{background:#33161A;box-shadow:inset 0 0 0 2px var(--seal)}
.fx h4{font-size:19px;font-weight:600;margin-bottom:3px}
.fx.ok h4{color:var(--jade)} .fx.no h4{color:#FF8878}
.fx small{color:var(--dim);font-size:13px}
.fx .btn{margin-top:14px}
.stampPop{position:fixed;inset:0;z-index:40;display:none;place-items:center;pointer-events:none}
.stampPop.on{display:grid}
.stampPop div{width:150px;height:150px;border-radius:26px;display:grid;place-items:center;background:var(--seal);color:#FFE3DE;font-family:'Noto Serif SC',serif;font-size:56px;box-shadow:inset 0 0 0 5px #FF8878,0 0 70px rgba(226,59,46,.6);animation:stamp .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes stamp{0%{transform:scale(2.6) rotate(-32deg);opacity:0}55%{transform:scale(.9) rotate(-12deg);opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}

/* ================= nav ================= */
.rail{position:fixed;bottom:0;left:0;right:0;z-index:15;display:flex;background:#0A1024;border-top:1px solid var(--night3)}
.rail button{flex:1;border:0;background:none;cursor:pointer;padding:11px 0 14px;color:var(--dim);font-family:inherit;font-size:12px;transition:color .15s}
.rail button span{display:block;font-size:21px;margin-bottom:2px}
.rail button.on{color:var(--lantern)}

/* ================= TABLET ≥720 ================= */
@media(min-width:720px){
  :root{--pad:32px}
  .wrap{max-width:700px}
  .h1{font-size:30px}
  #start .hero{padding-top:12vh}
  .bigLantern{width:140px;height:172px}
  .bigLantern .zi{font-size:66px}
  .title{font-size:60px}
  .subtitle{font-size:27px}
  .tag{font-size:16px}
  .chapGrid{grid-template-columns:1fr 1fr;gap:16px}
  .pathGrid{
    grid-template-columns:1fr 1fr;
    grid-template-areas:"rope rope" "a b";
    gap:24px;
  }
  .grid{gap:16px}
  .opt{padding:20px 12px;font-size:16px}
  .opt .emo{font-size:56px}
  .sheet{border-radius:26px;max-width:520px;margin-bottom:40px}
  .dim{align-items:center}
  .fx .in{max-width:560px}
}

/* ================= DESKTOP ≥1080 ================= */
@media(min-width:1080px){
  :root{--rail:104px;--pad:40px}
  .screen{padding-bottom:56px}
  .wrap{max-width:1180px}

  /* left vertical rail */
  .rail{
    top:0;right:auto;bottom:0;width:var(--rail);
    flex-direction:column;justify-content:center;gap:6px;
    border-top:0;border-right:1px solid var(--night3);
  }
  .rail button{flex:none;padding:16px 0;font-size:13px}
  .rail button span{font-size:26px;margin-bottom:5px}

  /* start = wide hero */
  #start .hero{
    grid-template-columns:auto 1fr;gap:64px;
    text-align:left;place-items:center start;
    min-height:86vh;align-content:center;max-width:980px;margin:0 auto;padding-top:0;
  }
  .bigLantern{width:200px;height:246px;margin-bottom:0}
  .bigLantern .zi{font-size:94px}
  .bigLantern .cap,.bigLantern .base{width:92px;height:22px}
  .title{font-size:82px}
  .subtitle{font-size:34px}
  .tag{font-size:18px;max-width:420px;margin:14px 0 40px}
  .startBtns{max-width:320px}

  .chapGrid{grid-template-columns:repeat(3,1fr);gap:18px}
  .card{padding:20px}

  /* path = 3 columns, rope keeps a readable width */
  .pathGrid{
    grid-template-columns:1fr 460px 1fr;
    grid-template-areas:"a rope b";
    gap:28px;align-items:start;
  }
  .panel{position:sticky;top:32px}

  /* quiz = prompt left, options right */
  .quizGrid{grid-template-columns:360px 1fr;gap:48px;align-items:start}
  .quizL{position:sticky;top:32px}
  .hz{font-size:60px}
  .py{font-size:17px}
  .ask{font-size:17px}
  .grid{margin-bottom:24px}
  .opt{padding:26px 14px;font-size:17px}
  .opt .emo{font-size:70px;margin-bottom:10px}
  #checkBtn{max-width:300px;margin-left:auto}
  .fx{padding-bottom:32px}
  .fx .in{max-width:620px;margin-right:0;margin-left:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
<div class="sky" id="sky"></div>

<main>
<!-- ============ START ============ -->
<section class="screen on" id="start">
  <div class="hero">
    <div class="bigLantern"><div class="cap"></div><div class="body"></div><div class="zi">中</div><div class="base"></div><div class="tassel"></div></div>
    <div>
      <div class="title">杜津</div>
      <div class="subtitle">Dujeen Quest</div>
      <div class="tag">จุดโคมทีละดวง จนพูดจีนได้ทั้งเมือง</div>
      <div class="startBtns">
        <button class="btn" onclick="go('chapters')">เริ่มเกม</button>
        <button class="btn ghost" onclick="alert('เดโมนี้ยังไม่มีระบบบันทึกจริง')">เล่นต่อจากเดิม</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ CHAPTERS ============ -->
<section class="screen" id="chapters">
  <div class="wrap">
    <div class="top">
      <div style="flex:1"><div class="h2">แผนที่การเดินทาง</div><div class="h1">เลือกบทเรียน</div></div>
      <div class="stat">🏮 <b>3</b></div>
      <div class="stat">🔥 <b>2</b></div>
    </div>
    <div class="chapGrid" id="chapterList"></div>
  </div>
</section>

<!-- ============ PATH ============ -->
<section class="screen" id="path">
  <div class="wrap">
    <div class="top">
      <button class="back" onclick="go('chapters')">‹</button>
      <div style="flex:1"><div class="h2" id="pathZh">自我介绍</div><div class="h1" id="pathTh">แนะนำตัวเอง</div></div>
      <div class="stat">2/5</div>
    </div>
    <div class="pathGrid">
      <div class="rope" id="rope"></div>
      <div class="panel" id="pVocab">
        <h5>คำศัพท์ในบทนี้</h5>
        <div class="chips">
          <button class="chip" onclick="ping()"><b>你好</b><i>nǐ hǎo</i></button>
          <button class="chip" onclick="ping()"><b>我</b><i>wǒ</i></button>
          <button class="chip" onclick="ping()"><b>叫</b><i>jiào</i></button>
          <button class="chip" onclick="ping()"><b>是</b><i>shì</i></button>
          <button class="chip" onclick="ping()"><b>名字</b><i>míng zi</i></button>
          <button class="chip" onclick="ping()"><b>认识</b><i>rèn shi</i></button>
        </div>
      </div>
      <div class="panel" id="pStamp">
        <h5>ตราประทับที่สะสมได้</h5>
        <div class="stampRow">
          <div class="sm">过</div><div class="sm">过</div>
          <div class="sm off">?</div><div class="sm off">?</div>
          <div class="sm off">?</div><div class="sm off">?</div>
          <div class="sm off">?</div><div class="sm off">?</div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ============ QUIZ ============ -->
<section class="screen" id="quiz">
  <div class="wrap">
    <div class="top">
      <button class="back" onclick="go('path')">✕</button>
      <div class="prog" style="flex:1"><i></i></div>
    </div>
    <div class="quizGrid">
      <div class="quizL">
        <div class="ask">เลือกภาพที่ตรงกับคำนี้</div>
        <div class="word">
          <button class="spk" onclick="ping()">🔊</button>
          <div><div class="py">nǐ hǎo</div><div class="hz">你好</div></div>
        </div>
      </div>
      <div>
        <div class="grid" id="opts"></div>
        <button class="btn" id="checkBtn" disabled onclick="check()">ตรวจคำตอบ</button>
      </div>
    </div>
  </div>
</section>
</main>

<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="fx" id="fx"><div class="in"><h4 id="fxT"></h4><small id="fxS"></small><button class="btn" onclick="nextQ()">ต่อไป</button></div></div>
<div class="stampPop" id="pop"><div>过</div></div>

<nav class="rail">
  <button class="on" onclick="go('chapters')"><span>🏮</span>เรียน</button>
  <button onclick="alert('หน้าทวนข้อที่เคยผิด')"><span>🎯</span>ทวน</button>
  <button onclick="alert('หน้าโปรไฟล์และตราประทับ')"><span>🧧</span>ฉัน</button>
</nav>
</div>

<script>
const CHAPTERS=[
 {zh:'自我介绍',th:'แนะนำตัวเอง',done:5,all:5},
 {zh:'数字年龄',th:'ตัวเลขและอายุ',done:2,all:5},
 {zh:'我的家人',th:'ครอบครัว',done:0,all:5},
 {zh:'国家语言',th:'ประเทศและภาษา',done:0,all:5,lock:1},
 {zh:'工作职业',th:'อาชีพ',done:0,all:5,lock:1},
 {zh:'吃和喝',th:'อาหาร',done:0,all:6,lock:1},
 {zh:'买东西',th:'ซื้อของ',done:0,all:6,lock:1},
 {zh:'时间日期',th:'เวลาและวัน',done:0,all:5,lock:1},
 {zh:'出行交通',th:'การเดินทาง',done:0,all:6,lock:1},
 {zh:'兴趣爱好',th:'งานอดิเรก',done:0,all:6,lock:1}
];
const NODES=[
 {ico:'学',cap:'ทักทาย',s:'done'},
 {ico:'练',cap:'ทวนคำทักทาย',s:'done'},
 {ico:'学',cap:'บอกชื่อตัวเอง',s:'now'},
 {ico:'练',cap:'ทวนการบอกชื่อ',s:'lock'},
 {ico:'考',cap:'ทวนรวมทั้งบท',s:'lock'}
];
const OPTS=[{emo:'🇹🇭',t:'ประเทศไทย'},{emo:'👋',t:'สวัสดี',ok:1},{emo:'👨‍🏫',t:'ครู'},{emo:'🙋',t:'ฉัน ผม'}];

for(let i=0;i<18;i++){
  const s=document.createElement('div');s.className='spark';
  s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(11+Math.random()*13)+'s';
  s.style.animationDelay=(-Math.random()*20)+'s';
  sky.appendChild(s);
}

chapterList.innerHTML=CHAPTERS.map((c,i)=>{
  const full=c.done===c.all&&c.all>0;
  return `<div class="card ${c.lock?'lock':''} ${full?'done':''}" onclick="${c.lock?'':`openCh(${i})`}">
    <div class="num">${c.lock?'🔒':i+1}</div>
    <div class="txt">
      <div class="zh">${c.zh}</div><div class="th">${c.th}</div>
      <div class="bar"><i style="width:${c.all?c.done/c.all*100:0}%"></i></div>
      <div class="cnt">${c.lock?'จบบทก่อนหน้าเพื่อปลดล็อค':c.done+' / '+c.all+' ด่าน'}</div>
    </div>${full?'<div class="seal">过</div>':''}
  </div>`;
}).join('');

rope.innerHTML=NODES.map((n,i)=>`
  <div class="node ${i%2?'r':'l'}">
    <button class="lamp ${n.s}" onclick="tap('${n.s}')">
      <div class="glass"><div class="ico">${n.s==='lock'?'🔒':n.ico}</div>${n.s==='done'?'<div class="tiny">过</div>':''}</div>
      <div class="cap">${n.cap}</div>
    </button>
  </div>`).join('');

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  window.scrollTo(0,0);
}
function openCh(i){pathZh.textContent=CHAPTERS[i].zh;pathTh.textContent=CHAPTERS[i].th;go('path')}
function tap(s){
  if(s==='now'){go('quiz');reset();return}
  if(s==='done'){sheetShow('ด่านนี้ผ่านแล้ว','เล่นซ้ำได้ แต่จะไม่ได้ตราประทับเพิ่ม','เล่นอีกครั้ง',()=>{closeSheet();go('quiz');reset()});return}
  sheetShow('ด่านนี้ยังล็อคอยู่',
   'ข้ามได้เลยถ้าทำบททดสอบรวมผ่าน — 15 ข้อจาก 3 ด่านที่ข้าม ผิดได้ไม่เกิน 2 ข้อ ผ่านแล้วปลดล็อคทั้ง 3 ด่านพร้อมกัน<br><br>วันนี้ทำได้อีก 1 ครั้ง',
   'ทำบททดสอบรวม',()=>{closeSheet();go('quiz');reset()});
}
function sheetShow(t,p,b,fn){
  sheet.innerHTML=`<h3>${t}</h3><p>${p}</p>`;
  const y=document.createElement('button');y.className='btn';y.textContent=b;y.onclick=fn;
  const n=document.createElement('button');n.className='btn ghost';n.textContent='ยังไม่พร้อม';n.onclick=closeSheet;
  sheet.append(y,n);dim.classList.add('on');
}
function closeSheet(){dim.classList.remove('on')}
dim.onclick=e=>{if(e.target===dim)closeSheet()};

let picked=-1;
function reset(){
  picked=-1;checkBtn.disabled=true;fx.className='fx';
  opts.innerHTML=OPTS.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span class="emo">${o.emo}</span>${o.t}</button>`).join('');
}
function pick(i){picked=i;checkBtn.disabled=false;ping();[...opts.children].forEach((el,j)=>el.classList.toggle('sel',i===j))}
function check(){
  const ok=!!OPTS[picked].ok;
  [...opts.children].forEach((el,j)=>{el.classList.remove('sel');
    if(OPTS[j].ok)el.classList.add('good'); else if(j===picked)el.classList.add('bad');});
  fxT.textContent=ok?'ถูกต้อง! 🏮':'ยังไม่ใช่';
  fxS.innerHTML=ok?'你好 nǐ hǎo — สวัสดี':'คำตอบที่ถูกคือ 你好 = สวัสดี';
  fx.className='fx on '+(ok?'ok':'no');
  if(ok){pop.classList.add('on');setTimeout(()=>pop.classList.remove('on'),820)}
}
function nextQ(){fx.className='fx';reset()}
function ping(){
  try{const c=new(window.AudioContext||window.webkitAudioContext)();
  const o=c.createOscillator(),g=c.createGain();
  o.frequency.value=660;o.connect(g);g.connect(c.destination);
  g.gain.setValueAtTime(.11,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);
  o.start();o.stop(c.currentTime+.22)}catch(e){}
}
reset();
</script>
